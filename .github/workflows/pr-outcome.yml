name: Product outcome (reusable)

# Checks the "Product outcome" lines of a pull request description. One tiny
# job with no checkout and no install; it runs on the netcup runners.
#
# Required check name in branch protection: "pr / Product outcome" (caller job
# id `pr`, this job's name `Product outcome`). The caller must grant
# pull-requests: read and issues: read.

on:
  workflow_call:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  outcome:
    name: Product outcome
    runs-on: ${{ github.event_name == 'pull_request' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 3
    concurrency:
      group: pr-outcome-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check the description
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHARED_REPO: ${{ job.workflow_repository }}
          SHARED_SHA: ${{ job.workflow_sha }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$SHARED_REPO/$SHARED_SHA/scripts/ci/product-outcome.mjs" -o "$RUNNER_TEMP/product-outcome.mjs"
          node "$RUNNER_TEMP/product-outcome.mjs"
