name: Self-test

# CI for this repository. It is public, so GitHub-hosted minutes are free and
# the org's self-hosted runners (private repositories only) are not used.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint workflows and test scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          # actionlint does not know job.workflow_repository / job.workflow_sha
          # yet (documented GitHub contexts for reusable workflows).
          ./actionlint -color -ignore 'property "workflow_(repository|sha)" is not defined' .github/workflows/*.yml templates/*-caller.yml
      - name: Test CI scripts
        run: node --test scripts/ci/*.node-test.mjs
